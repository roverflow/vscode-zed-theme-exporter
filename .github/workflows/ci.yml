name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq unzip

      - name: Check shell syntax
        run: bash -n vsc2zed && bash -n lib/interactive.sh && bash -n tests/run.sh

      - name: Test
        run: ./tests/run.sh

  # Advisory. Fails when the upstream extension publishes new colors, which is
  # information, not a broken build.
  upstream-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq unzip
      - name: Night Wolf export matches the published extension
        run: |
          ./vsc2zed -q -o /tmp/regen MaoSantaella.night-wolf
          diff <(jq -S . themes/night-wolf.json) <(jq -S . /tmp/regen/night-wolf.json)
